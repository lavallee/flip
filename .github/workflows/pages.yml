name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "SPEC.md"
      - "pyproject.toml"
      - "src/flip/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # The site's data is generated by running the real CLI, so the flip under
      # test is this checkout — not whatever is on PyPI.
      - run: uv sync
      - run: uv tool install --force .
      - run: uv tool install artoo-artifacts

      - name: Build the artifact
        run: artoo build website

      - name: Firewall and coherence checks
        run: |
          artoo status website
          artoo doctor .

      - name: Refuse to publish internal names
        run: |
          if grep -rniE '\b(weaver|frank|collagen|malo|fab|keel|barnowl|cistern|downunder|paperboy|george|oslo|delphi|trawler|jackdaw|eno)\b' website/site; then
            echo "::error::internal name found in the deployable site"
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
