id = "review-brief"
version = "0.1"
summary = "A bounded review with explicit criteria, source judgments, and limitations."
aka = ["review brief"]

[contract]
[[contract.require]]
id = "criteria"
what = "State the inclusion and exclusion criteria."
entity = "files"
path = "criteria.md"
min = 1
assembled_by = "Methods"

[[contract.require]]
id = "sources"
what = "Capture and judge at least two sources."
entity = "references"
min = 2
assembled_by = "Evidence"
