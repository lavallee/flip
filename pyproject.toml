[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flip-notebook"
version = "0.24.0"
description = "Help your agent be a reporter, not a stenographer"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Marc Lavallee" }]
keywords = [
  "research", "provenance", "journalism", "notebook", "agents", "knowledge",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Documentation",
]
# Core is deliberately small: click for the CLI, PyYAML for reading
# human/editor-authored frontmatter faithfully; stdlib for everything else.
# No network calls, no LLM calls, no services (SPEC §15).
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/lavallee/flip"
Documentation = "https://lavallee.github.io/flip/start.html"
Repository = "https://github.com/lavallee/flip"
Issues = "https://github.com/lavallee/flip/issues"
Changelog = "https://github.com/lavallee/flip/blob/main/CHANGELOG.md"

[project.scripts]
flip = "flip.cli:main"
flip-fetch = "flip.fetch:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/flip"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

# flip ships its agent skills as a spindle package: any repo or agent surface
# can `spindle bind` to receive the notebook-* skills. Spindle is optional —
# the skills are plain markdown under src/flip/skills/ and work standalone.
[tool.spindle.package]
name = "flip"
version = "0.24.0"
skills = [
  "notebook-create",
  "notebook-source",
  "notebook-log",
  "notebook-audit",
  "notebook-handoff",
  "notebook-lessons",
  "notebook-kind-author",
  "notebook-extend",
  "notebook-workflow-author",
  "notebook-plugin-author",
]
capabilities = [
  "research-notebook-scaffolding",
  "source-custody-and-provenance",
  "claim-audit",
  "session-logging",
  "notebook-handoff",
  "lessons-distillation",
  "workflow-authoring",
  "plugin-authoring",
]
